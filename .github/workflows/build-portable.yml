name: Build Pake Portable

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What should the builder do?
        required: true
        default: one-off
        type: choice
        options:
          - one-off
          - rebuild-saved
          - inspect-storage

      upstream_repo:
        description: Source repository (leave blank for YOUR-USERNAME/Pake)
        required: false
        default: ""

      upstream_ref:
        description: Source branch/tag/SHA
        required: false
        default: "main"

      url:
        description: Website URL (one-off mode)
        required: false
        default: "https://example.com"

      app_name:
        description: App name (one-off mode)
        required: false
        default: "Example"

      icon:
        description: Icon URL or path (optional)
        required: false
        default: ""

      width:
        description: Window width
        required: false
        default: "1200"

      height:
        description: Window height
        required: false
        default: "780"

      show_system_tray:
        description: Show system tray icon
        required: false
        type: boolean
        default: true

      hide_on_close:
        description: Hide instead of exiting when window is closed
        required: false
        type: boolean
        default: true

      start_to_tray:
        description: Start hidden in tray
        required: false
        type: boolean
        default: false

      incognito:
        description: Incognito (does not keep website login/storage)
        required: false
        type: boolean
        default: false

      enable_find:
        description: Enable Ctrl+F find
        required: false
        type: boolean
        default: true

      dark_mode:
        description: Force dark mode
        required: false
        type: boolean
        default: false

      min_width:
        description: Minimum window width (0 = Pake default)
        required: false
        default: "0"

      min_height:
        description: Minimum window height (0 = Pake default)
        required: false
        default: "0"

      zoom:
        description: Initial zoom percent (50-200)
        required: false
        default: "100"

      hide_window_decorations:
        description: Frameless Windows window with drag region
        required: false
        type: boolean
        default: false

      fullscreen:
        description: Start in fullscreen
        required: false
        type: boolean
        default: false

      maximize:
        description: Start maximized
        required: false
        type: boolean
        default: false

      activation_shortcut:
        description: Global show/hide shortcut, e.g. CmdOrControl+Shift+P
        required: false
        default: ""

      always_on_top:
        description: Keep window always on top
        required: false
        type: boolean
        default: false

      force_internal_navigation:
        description: Keep clicked links inside the Pake window
        required: false
        type: boolean
        default: false

      multi_window:
        description: Allow multiple windows in one app process
        required: false
        type: boolean
        default: false

      new_window:
        description: Allow websites to open popup/new windows
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pake-portable-build
  cancel-in-progress: false

jobs:
  build:
    name: Pake Portable
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout portable-builder repository
        uses: actions/checkout@v7

      - name: Resolve source repository
        id: source
        shell: pwsh
        run: |
          $repo = "${{ inputs.upstream_repo }}"
          if ([string]::IsNullOrWhiteSpace($repo)) {
            $repo = "${{ github.repository_owner }}/Pake"
          }

          $ref = "${{ inputs.upstream_ref }}"
          if ([string]::IsNullOrWhiteSpace($ref)) {
            $ref = "main"
          }

          "repo=$repo" >> $env:GITHUB_OUTPUT
          "ref=$ref" >> $env:GITHUB_OUTPUT

          Write-Host "Source repository: $repo"
          Write-Host "Source ref:        $ref"

      - name: Checkout synced Pake fork
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.ref }}
          path: upstream
          fetch-depth: 1

      - name: Record source revision
        id: revision
        shell: pwsh
        run: |
          $rev = (git -C upstream rev-parse HEAD).Trim()
          "sha=$rev" >> $env:GITHUB_OUTPUT
          Write-Host "Source revision: $rev"

      - name: Inspect pristine Pake storage paths
        if: ${{ inputs.mode == 'inspect-storage' }}
        shell: pwsh
        run: |
          & .\scripts\Inspect-Pake-Storage.ps1 `
            -SourceRoot "$PWD\upstream" `
            -OutputRoot "$PWD\artifact\Pake-Storage-Inspection"

      - name: Upload storage-path inspection
        if: ${{ inputs.mode == 'inspect-storage' }}
        uses: actions/upload-artifact@v7
        with:
          name: Pake-Storage-Inspection-${{ steps.revision.outputs.sha }}
          path: artifact/Pake-Storage-Inspection/**
          if-no-files-found: error
          retention-days: 30

      - name: Install pnpm 10.26.2
        if: ${{ inputs.mode != 'inspect-storage' }}
        uses: pnpm/action-setup@v6.0.3
        with:
          version: 10.26.2
          run_install: false

      - name: Setup Node 22
        if: ${{ inputs.mode != 'inspect-storage' }}
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml

      - name: Setup Rust
        if: ${{ inputs.mode != 'inspect-storage' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: ${{ inputs.mode != 'inspect-storage' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/src-tauri

      - name: Install Pake dependencies
        if: ${{ inputs.mode != 'inspect-storage' }}
        working-directory: upstream
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build Pake CLI
        if: ${{ inputs.mode != 'inspect-storage' }}
        working-directory: upstream
        shell: pwsh
        run: pnpm run cli:build

      - name: Upgrade temporary Tauri checkout for portable paths
        if: ${{ inputs.mode != 'inspect-storage' }}
        shell: pwsh
        run: |
          & .\scripts\Upgrade-Pake-Tauri-Portable.ps1 `
            -SourceRoot "$PWD\upstream"

      - name: Apply true-portable source patch
        if: ${{ inputs.mode != 'inspect-storage' }}
        shell: pwsh
        run: |
          & .\scripts\Apply-Pake-Portable-Patch.ps1 `
            -SourceRoot "$PWD\upstream"

      - name: Verify portable patch
        if: ${{ inputs.mode != 'inspect-storage' }}
        shell: pwsh
        run: |
          & .\scripts\Verify-Pake-Portable-Source.ps1 `
            -SourceRoot "$PWD\upstream"

      - name: Compile-check patched Pake source
        if: ${{ inputs.mode != 'inspect-storage' }}
        working-directory: upstream/src-tauri
        shell: pwsh
        run: cargo check

      - name: Build one-off portable app
        if: ${{ inputs.mode == 'one-off' }}
        shell: pwsh
        run: |
          & .\scripts\Build-One-PakeApp.ps1 `
            -SourceRoot "$PWD\upstream" `
            -KitRoot "$PWD" `
            -OutputRoot "$PWD\artifact\Pake-Portable-Apps" `
            -Url "${{ inputs.url }}" `
            -Name "${{ inputs.app_name }}" `
            -Icon "${{ inputs.icon }}" `
            -Width ([int]"${{ inputs.width }}") `
            -Height ([int]"${{ inputs.height }}") `
            -ShowSystemTray ([System.Convert]::ToBoolean("${{ inputs.show_system_tray }}")) `
            -HideOnClose ([System.Convert]::ToBoolean("${{ inputs.hide_on_close }}")) `
            -StartToTray ([System.Convert]::ToBoolean("${{ inputs.start_to_tray }}")) `
            -Incognito ([System.Convert]::ToBoolean("${{ inputs.incognito }}")) `
            -EnableFind ([System.Convert]::ToBoolean("${{ inputs.enable_find }}")) `
            -DarkMode ([System.Convert]::ToBoolean("${{ inputs.dark_mode }}")) `
            -MinWidth ([int]"${{ inputs.min_width }}") `
            -MinHeight ([int]"${{ inputs.min_height }}") `
            -Zoom ([int]"${{ inputs.zoom }}") `
            -HideWindowDecorations ([System.Convert]::ToBoolean("${{ inputs.hide_window_decorations }}")) `
            -Fullscreen ([System.Convert]::ToBoolean("${{ inputs.fullscreen }}")) `
            -Maximize ([System.Convert]::ToBoolean("${{ inputs.maximize }}")) `
            -ActivationShortcut "${{ inputs.activation_shortcut }}" `
            -AlwaysOnTop ([System.Convert]::ToBoolean("${{ inputs.always_on_top }}")) `
            -ForceInternalNavigation ([System.Convert]::ToBoolean("${{ inputs.force_internal_navigation }}")) `
            -MultiWindow ([System.Convert]::ToBoolean("${{ inputs.multi_window }}")) `
            -NewWindow ([System.Convert]::ToBoolean("${{ inputs.new_window }}"))

      - name: Rebuild saved portable apps
        if: ${{ inputs.mode == 'rebuild-saved' }}
        shell: pwsh
        run: |
          & .\scripts\Build-Saved-PakeApps.ps1 `
            -SourceRoot "$PWD\upstream" `
            -KitRoot "$PWD" `
            -AppsRoot "$PWD\apps" `
            -OutputRoot "$PWD\artifact\Pake-Portable-Apps"

      - name: Upload portable app(s)
        if: ${{ inputs.mode != 'inspect-storage' }}
        uses: actions/upload-artifact@v7
        with:
          name: Pake-Portable-Windows-x64-${{ steps.revision.outputs.sha }}
          path: artifact/Pake-Portable-Apps/**
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: ${{ failure() && inputs.mode != 'inspect-storage' }}
        shell: pwsh
        run: |
          & .\scripts\Collect-Pake-Diagnostics.ps1 `
            -SourceRoot "$PWD\upstream" `
            -OutputRoot "$PWD\artifact\Pake-Failure-Diagnostics"

      - name: Upload failure diagnostics
        if: ${{ failure() && inputs.mode != 'inspect-storage' }}
        uses: actions/upload-artifact@v7
        with:
          name: Pake-Portable-FAILURE-Diagnostics-${{ steps.revision.outputs.sha }}
          path: artifact/Pake-Failure-Diagnostics/**
          if-no-files-found: warn
          retention-days: 30
